# ---------- Database (PostgreSQL) ----------
# All values can be overridden with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cabbooking}
spring.datasource.username=${DB_USER:cabuser}
spring.datasource.password=${DB_PASSWORD:cabpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Creates/updates tables automatically for local development.
# For production, use database/schema.sql instead and set DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Security ----------
# Must be at least 32 characters. NEVER commit a real secret.
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-to-at-least-32-chars}
app.jwt.expiration-ms=3600000

# Comma-separated list of allowed frontend origins.
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Pricing (INR) ----------
fare.base=${FARE_BASE:60}
fare.per-km=${FARE_PER_KM:15}
fare.min=${FARE_MIN:80}

# ---------- Stripe (test mode; optional) ----------
# Leave empty to run without online payments - the app still works.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ---------- First admin account (created on startup if both are set) ----------
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
